<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>新年倒计时（页面应用版）</title>

  <!-- PWA / iOS：添加到桌面后以“应用”方式打开（隐藏地址栏/底部栏） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="新年倒计时" />
  <meta name="theme-color" content="#000000" />

  <!-- 图标（你需要提供对应文件） -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- GitHub Pages / 静态托管（推荐） -->
  <base href="./" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    body { margin:0; padding:0; overflow:hidden; }
    .glass { background: rgba(255,255,255,0.10); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .cyber-glow { text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff; }
    @keyframes horse-run {
      0% { transform: translateX(-10px) translateY(0); }
      50% { transform: translateX(10px) translateY(-5px); }
      100% { transform: translateX(-10px) translateY(0); }
    }
    .animate-horse { animation: horse-run 0.5s infinite ease-in-out; }

    /* 适配 iPhone 刘海 */
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>

<body class="bg-black text-white antialiased select-none touch-none overflow-hidden">
  <div id="app" class="relative w-screen h-screen overflow-hidden group">

    <!-- 顶部：Logo（不搞花里胡哨 tab，仅一个角标） -->
    <div class="fixed top-0 left-0 right-0 z-40 safe-top pointer-events-none">
      <div class="pointer-events-auto px-4 pt-3">
        <div class="inline-flex items-center gap-2 glass border border-white/10 rounded-2xl px-3 py-2">
          <img
            src="./icons/icon-192.png"
            alt="Logo"
            class="w-7 h-7 rounded-xl border border-white/10"
            draggable="false"
          />
          <div class="leading-tight">
            <div class="text-sm font-extrabold tracking-tight">新年倒计时</div>
            <div class="text-[10px] text-white/60">页面应用版</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主体 -->
    <div id="style-wrapper" class="w-full h-full flex flex-col items-center justify-center transition-all duration-1000 p-4 overflow-hidden">
      <div id="clock-content" class="w-full h-full flex flex-col items-center justify-center"></div>
    </div>

    <!-- 悬浮控制（点击/移动后出现，自动隐藏；底部不放任何“网页说明栏”） -->
    <div id="controls" class="fixed left-1/2 -translate-x-1/2 z-40 px-4 w-full max-w-lg opacity-0 translate-y-4 pointer-events-none transition-all duration-500 safe-bottom"
         style="bottom: calc(1rem + env(safe-area-inset-bottom));">
      <div class="flex flex-wrap justify-center gap-2 sm:gap-4">
        <button id="btn-reset"
          class="bg-orange-600 text-white px-4 sm:px-6 py-2.5 sm:py-3.5 rounded-full shadow-lg border border-white/20 font-bold transition-all hover:scale-105 active:scale-95 flex items-center gap-2 text-xs sm:text-sm whitespace-nowrap">
          <span>🔄</span> 重新开始
        </button>
        <button id="btn-settings"
          class="bg-black/40 text-white px-4 sm:px-6 py-2.5 sm:py-3.5 rounded-full backdrop-blur-md border border-white/20 font-bold transition-all hover:scale-105 active:scale-95 text-xs sm:text-sm whitespace-nowrap">
          <span>⚙️</span> 配置
        </button>
        <button id="btn-fullscreen"
          class="bg-black/40 text-white px-4 sm:px-6 py-2.5 sm:py-3.5 rounded-full backdrop-blur-md border border-white/20 font-bold transition-all hover:scale-105 active:scale-95 text-xs sm:text-sm whitespace-nowrap hidden sm:flex">
          📽️ 全屏
        </button>
      </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden"></div>
    <div id="settings-panel"
      class="fixed inset-y-0 right-0 w-[85vw] sm:w-80 bg-neutral-900 border-l border-white/10 p-5 md:p-6 shadow-2xl z-50 overflow-y-auto transform transition-transform duration-300 translate-x-full">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-xl font-bold text-white">配置</h2>
        <button id="btn-close-settings" class="p-2 hover:bg-white/10 rounded-full text-white/50 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="space-y-6 text-sm text-neutral-300">
        <div>
          <label class="block mb-2 font-medium">风格</label>
          <div class="grid grid-cols-1 gap-2" id="style-selector"></div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="font-medium text-blue-300">模拟此刻时间</label>
            <button id="btn-realtime" class="text-[10px] bg-blue-500/20 text-blue-200 px-2 py-0.5 rounded hover:bg-blue-500/40">
              设为真实时间
            </button>
          </div>
          <input type="datetime-local" step="1" id="input-virtual-now"
            class="w-full bg-blue-500/10 border border-blue-500/30 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500/50 text-blue-100 text-xs md:text-sm" />
        </div>

        <div>
          <label class="block mb-2 font-medium">自定义语录</label>
          <textarea id="input-message" placeholder="输入一句祝福..."
            class="w-full bg-white/5 border border-white/10 rounded-lg p-2.5 h-20 md:h-24 focus:outline-none focus:ring-2 focus:ring-white/20 resize-none text-xs md:text-sm"></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PWA：注册 Service Worker（用于“添加到桌面后更像应用 + 可离线打开”）
    // 注意：iOS 对 SW 支持取决于系统版本，HTTPS 托管更稳定。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // --- 常量 ---
    const ClockStyle = {
      IOS_MINIMAL: '极简 iOS',
      FUTURE_TECH: '未来科技',
      GALLOPING_SPIRIT: '红火奔腾'
    };

    const THEMES = {
      [ClockStyle.IOS_MINIMAL]: "bg-neutral-50 text-neutral-900",
      [ClockStyle.FUTURE_TECH]: "bg-slate-950 text-cyan-400",
      [ClockStyle.GALLOPING_SPIRIT]: "bg-red-700 text-yellow-300"
    };

    // --- 状态 ---
    const state = {
      settings: {
        virtualNow: "",
        customMessage: "凡是过往，皆为序章。新年快乐！",
        style: ClockStyle.GALLOPING_SPIRIT
      },
      offset: 0,
      clockData: { year:0, month:0, day:0, hours:0, minutes:0, seconds:0 },
      ui: { isSettingsOpen:false, isFullScreen:false, uiTimer:null }
    };

    const els = {
      app: document.getElementById('app'),
      styleWrapper: document.getElementById('style-wrapper'),
      clockContent: document.getElementById('clock-content'),
      controls: document.getElementById('controls'),
      settingsPanel: document.getElementById('settings-panel'),
      settingsBackdrop: document.getElementById('settings-backdrop'),
      btnReset: document.getElementById('btn-reset'),
      btnSettings: document.getElementById('btn-settings'),
      btnCloseSettings: document.getElementById('btn-close-settings'),
      btnFullscreen: document.getElementById('btn-fullscreen'),
      btnRealtime: document.getElementById('btn-realtime'),
      inputVirtualNow: document.getElementById('input-virtual-now'),
      inputMessage: document.getElementById('input-message'),
      styleSelector: document.getElementById('style-selector')
    };

    const pad = (num) => num.toString().padStart(2, '0');
    const getFormattedDate = (date) => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 19);

    function init() {
      // 初始时间：当年 12/31 23:59:10
      const currentYear = new Date().getFullYear();
      const virtualStart = new Date(currentYear, 11, 31, 23, 59, 10);
      state.settings.virtualNow = getFormattedDate(virtualStart);

      calculateOffset();
      setupEventListeners();
      initSettingsUI();

      setInterval(tickClock, 100);
      tickClock();
      render();
    }

    function calculateOffset() {
      const vNow = new Date(state.settings.virtualNow).getTime();
      const rNow = Date.now();
      state.offset = vNow - rNow;
    }

    function tickClock() {
      const effectiveNow = new Date(Date.now() + state.offset);
      state.clockData = {
        year: effectiveNow.getFullYear(),
        month: effectiveNow.getMonth() + 1,
        day: effectiveNow.getDate(),
        hours: effectiveNow.getHours(),
        minutes: effectiveNow.getMinutes(),
        seconds: effectiveNow.getSeconds()
      };
      updateTimeDisplay();
    }

    // --- 渲染 ---
    let currentStyle = null;

    function render() {
      if (currentStyle !== state.settings.style) {
        currentStyle = state.settings.style;
        els.styleWrapper.className =
          `w-full h-full flex flex-col items-center justify-center transition-all duration-1000 p-4 overflow-hidden ${THEMES[currentStyle] || "bg-black text-white"}`;
        renderClockStructure(currentStyle);
      }

      if (document.activeElement !== els.inputVirtualNow) {
        els.inputVirtualNow.value = state.settings.virtualNow;
      }
      if (document.activeElement !== els.inputMessage) {
        els.inputMessage.value = state.settings.customMessage;
      }
    }

    function renderClockStructure(style) {
      const container = els.clockContent;
      container.innerHTML = '';

      if (style === ClockStyle.IOS_MINIMAL) {
        container.innerHTML = `
          <div class="flex flex-col items-center gap-2 md:gap-6 font-['Inter'] w-full max-w-[95vw]">
            <div id="date-el" class="text-[4vw] sm:text-[2.5vw] md:text-2xl lg:text-3xl tracking-[0.2em] opacity-60 font-medium"></div>
            <div class="flex items-baseline justify-center tabular-nums text-[18vw] sm:text-[15vw] md:text-[18vw] lg:text-[16vw] xl:text-[20rem] font-extrabold leading-none tracking-tighter select-none">
              <span id="hours-el" class="inline-block text-right min-w-[1.2em]"></span>
              <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
              <span id="minutes-el" class="inline-block text-center min-w-[1.2em]"></span>
              <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
              <span id="seconds-el" class="inline-block text-left min-w-[1.2em]"></span>
            </div>
            <div id="message-el" class="text-[4vw] sm:text-[3vw] md:text-2xl lg:text-3xl xl:text-4xl font-light tracking-tight text-center opacity-70 mt-2 md:mt-4 max-w-[80%] line-clamp-2"></div>
          </div>
        `;
      } else if (style === ClockStyle.FUTURE_TECH) {
        container.innerHTML = `
          <div class="relative flex flex-col items-center font-['JetBrains_Mono'] w-full h-full justify-center">
            <div class="absolute inset-0 opacity-10 pointer-events-none"
              style="background-image: radial-gradient(circle, #22d3ee 1px, transparent 1px);
              background-size: clamp(30px, 5vw, 60px) clamp(30px, 5vw, 60px);"></div>

            <div id="date-el" class="text-[3vw] sm:text-[2vw] md:text-xl lg:text-2xl tracking-[0.5em] mb-4 border border-cyan-400/30 px-6 py-1 md:px-8 md:py-2 glass">
            </div>

            <div class="flex items-baseline justify-center tabular-nums text-[15vw] sm:text-[12vw] md:text-[14vw] lg:text-[12vw] xl:text-[15rem] font-bold cyber-glow leading-none">
              <span id="hours-el" class="inline-block text-right min-w-[1.2em]"></span>
              <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
              <span id="minutes-el" class="inline-block text-center min-w-[1.2em]"></span>
              <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
              <span id="seconds-el" class="inline-block text-left min-w-[1.2em]"></span>
            </div>

            <div class="mt-8 md:mt-12 text-[3.5vw] sm:text-[2.5vw] md:text-2xl lg:text-3xl tracking-widest text-center px-4 border-l-4 border-cyan-500 pl-4 md:pl-6 py-1 md:py-2 glass max-w-[90%] truncate">
              ＞ <span id="message-el"></span>_
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="flex flex-col items-center gap-2 md:gap-4 font-['Noto_Sans_SC'] w-full">
            <div id="date-el" class="text-[5vw] sm:text-[3.5vw] md:text-3xl lg:text-5xl font-black bg-yellow-400 text-red-700 px-6 py-1 md:px-10 md:py-2 transform -rotate-1 shadow-2xl mb-2 md:mb-4"></div>

            <div class="flex gap-1 items-center animate-horse">
              <div class="flex items-baseline justify-center tabular-nums text-[18vw] sm:text-[14vw] md:text-[16vw] lg:text-[18vw] xl:text-[22rem] font-black leading-none drop-shadow-2xl italic tracking-tighter">
                <span id="hours-el" class="inline-block text-right min-w-[1.2em]"></span>
                <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
                <span id="minutes-el" class="inline-block text-center min-w-[1.2em]"></span>
                <span class="mx-[0.1em] opacity-80 inline-block text-center w-[0.4em]">:</span>
                <span id="seconds-el" class="inline-block text-left min-w-[1.2em]"></span>
              </div>
            </div>

            <div id="message-el" class="text-[6vw] sm:text-[4.5vw] md:text-4xl lg:text-6xl font-black italic tracking-tighter text-yellow-400 transform skew-x-[-12deg] drop-shadow-lg text-center px-4 mt-4 md:mt-6 line-clamp-2 max-w-[95%]"></div>
          </div>
        `;
      }
    }

    function updateTimeDisplay() {
      const dateEl = document.getElementById('date-el');
      const hoursEl = document.getElementById('hours-el');
      const minutesEl = document.getElementById('minutes-el');
      const secondsEl = document.getElementById('seconds-el');
      const messageEl = document.getElementById('message-el');
      if (!dateEl || !hoursEl) return;

      const { year, month, day, hours, minutes, seconds } = state.clockData;
      dateEl.textContent = `${year}年${month}月${day}日`;
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);

      const msg = state.settings.customMessage;
      if (messageEl.textContent !== msg) messageEl.textContent = msg;
    }

    // --- 交互 ---
    function setupEventListeners() {
      const showUi = () => {
        if (state.ui.isSettingsOpen) return;
        els.controls.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
        els.controls.classList.add('opacity-100', 'translate-y-0');

        if (state.ui.uiTimer) clearTimeout(state.ui.uiTimer);
        state.ui.uiTimer = setTimeout(() => {
          if (!state.ui.isSettingsOpen) {
            els.controls.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            els.controls.classList.remove('opacity-100', 'translate-y-0');
          }
        }, 3000);
      };

      els.app.addEventListener('click', showUi);
      els.app.addEventListener('mousemove', showUi);

      els.btnReset.addEventListener('click', (e) => { e.stopPropagation(); calculateOffset(); });

      els.btnSettings.addEventListener('click', (e) => { e.stopPropagation(); openSettings(); });

      els.btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); toggleFullScreen(); });

      els.btnCloseSettings.addEventListener('click', closeSettings);
      els.settingsBackdrop.addEventListener('click', closeSettings);

      els.inputVirtualNow.addEventListener('change', (e) => {
        state.settings.virtualNow = e.target.value;
        calculateOffset();
      });

      els.inputMessage.addEventListener('input', (e) => {
        state.settings.customMessage = e.target.value;
      });

      els.btnRealtime.addEventListener('click', () => {
        const now = new Date();
        state.settings.virtualNow = getFormattedDate(now);
        render();
        calculateOffset();
      });
    }

    function initSettingsUI() {
      els.styleSelector.innerHTML = Object.values(ClockStyle).map(s => `
        <button class="style-btn p-3 rounded-lg text-left transition-all text-xs md:text-sm ${state.settings.style === s ? 'bg-white text-black font-bold' : 'bg-white/5 hover:bg-white/10'}" data-style="${s}">
          ${s}
        </button>
      `).join('');

      els.styleSelector.querySelectorAll('.style-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.settings.style = btn.dataset.style;
          updateStyleButtons();
          render();
        });
      });
    }

    function updateStyleButtons() {
      els.styleSelector.querySelectorAll('.style-btn').forEach(btn => {
        const s = btn.dataset.style;
        btn.className = state.settings.style === s
          ? 'style-btn p-3 rounded-lg text-left transition-all text-xs md:text-sm bg-white text-black font-bold'
          : 'style-btn p-3 rounded-lg text-left transition-all text-xs md:text-sm bg-white/5 hover:bg-white/10';
      });
    }

    function openSettings() {
      state.ui.isSettingsOpen = true;
      els.settingsBackdrop.classList.remove('hidden');
      els.settingsPanel.classList.remove('translate-x-full');

      els.controls.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      els.controls.classList.add('opacity-100', 'translate-y-0');
      if (state.ui.uiTimer) clearTimeout(state.ui.uiTimer);
    }

    function closeSettings() {
      state.ui.isSettingsOpen = false;
      els.settingsBackdrop.classList.add('hidden');
      els.settingsPanel.classList.add('translate-x-full');

      state.ui.uiTimer = setTimeout(() => {
        if (!state.ui.isSettingsOpen) {
          els.controls.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
          els.controls.classList.remove('opacity-100', 'translate-y-0');
        }
      }, 3000);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
        state.ui.isFullScreen = true;
        els.btnFullscreen.textContent = "退出全屏";
      } else {
        document.exitFullscreen?.();
        state.ui.isFullScreen = false;
        els.btnFullscreen.textContent = "📽️ 全屏";
      }
    }

    init();
  </script>
</body>
</html>
